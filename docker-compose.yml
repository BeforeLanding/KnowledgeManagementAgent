name: knowledge-management-agent
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kma
      POSTGRES_PASSWORD: kma
      POSTGRES_DB: kma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kma"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes: [qdrant-data:/qdrant/storage]
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: kma-local
      MINIO_ROOT_PASSWORD: change-me-local-only
    volumes: [minio-data:/data]
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command: ["sh", "-c", "cd /workspace && alembic upgrade head && cd services/api && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      minio: {condition: service_started}
  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      minio: {condition: service_started}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
